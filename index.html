<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Workout Rotator</title>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--sub:#64748b;--line:#e2e8f0;
  --accent:#2563eb;--accent-t:#fff;--ok:#16a34a;--danger:#dc2626;--chip:#e0e7ff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#162033;--text:#e5e7eb;--sub:#94a3b8;--line:#243047;
  --accent:#3b82f6;--chip:#1e2a4a;--danger:#f87171;--ok:#4ade80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* app-like: no text selection, no long-press menus, no image drag/open/share, except inside editable fields */
html,body,#app,#app *,.overlay,.overlay *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none;pointer-events:none}
a,button,.tile,.card{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#banner{background:#f59e0b;color:#111;font-size:12px;padding:5px 10px;text-align:center;display:none}
header{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:20px;margin:0;white-space:nowrap}
#tabs{display:flex;gap:4px}
#tabs button{background:none;border:0;border-radius:10px;color:var(--text);padding:7px 10px;line-height:1;opacity:.55}
#tabs button.on{background:var(--chip);color:var(--accent);opacity:1}
main{flex:1;overflow-y:auto;padding:4px 16px 90px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.next{border:2px solid var(--accent)}
.thenh{display:flex;align-items:center;gap:2px;margin:18px 0 8px}
.thenh h2{margin:0}
.thenh .x{padding:2px 6px}
.thenh .x .ic{width:22px;height:22px;stroke-width:2.6}
.card.open{cursor:pointer}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px;height:44px}
.hrow h2{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hrow > button{height:36px !important;padding-top:0 !important;padding-bottom:0 !important;margin:0 !important;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;flex-shrink:0}
.hrow.act h2{font-size:11px;letter-spacing:.02em;gap:3px 6px;flex-wrap:wrap}
.hrow.act .twotap.pill{padding:6px 10px;font-size:12px;min-width:74px;text-align:center;flex-shrink:0}
.twotap.cancel.pill{width:auto;margin-top:0;padding:7px 14px;font-size:14px;font-weight:600;border-radius:10px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:600;font-size:17px}
.meta{color:var(--sub);font-size:13px}
button.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600}
button.btn.big{width:100%;padding:14px;font-size:17px;margin-top:10px}
button.btn.sec{background:var(--chip);color:var(--accent)}
button.btn.ok{background:var(--ok);color:#fff}
button.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
button.btn.small{padding:7px 12px;font-size:13px}
.fab{display:flex;align-items:center;justify-content:center;position:fixed;right:max(16px,calc(50% - 264px));bottom:20px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font:inherit;margin-top:4px}
textarea{min-height:240px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
label{display:block;margin-top:14px;font-size:13px;color:var(--sub)}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none}
.readonly-text{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px;
  white-space:pre-wrap;word-wrap:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;margin-top:6px}
.twotap{width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:var(--ok);color:#fff;margin-top:12px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.twotap small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:2px}
.twotap.cancel{background:none;color:var(--danger);border:1px solid var(--danger);margin-top:36px}
.twotap.cancel.thin{width:auto;padding:3px 12px;font-size:12px;font-weight:600;margin-top:0;border-radius:99px;white-space:nowrap}
.twotap.armed{background:#f59e0b;color:#111;border-color:#f59e0b}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.overlay .in{max-width:560px;margin:0 auto;padding:16px}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;padding-top:2px}
.bars div{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%;white-space:nowrap}
.bars b{font-size:10px;color:var(--text);font-weight:600;line-height:1.3}
.bars i{display:block;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars i.cur{opacity:.55}
.bars div{cursor:pointer}
.bars.hs div:not(.sel) i{opacity:.3}
.bars.hs div.sel i{opacity:1}
.bars.hs div.sel em{color:var(--text);font-weight:700}
.tod{cursor:pointer}
.todwrap.hs .tod:not(.sel){opacity:.4}
.fltbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-top:6px;font-size:12px;color:var(--sub)}
.fltbar b{color:var(--text)}
.bars em{font-style:normal;height:13px;line-height:13px}
.bars em.wl{position:relative;overflow:visible}
.bars em.wl.f span{transform:translateX(-75%)}
.bars em.wl.l span{transform:translateX(-25%)}
.bars em.wl span{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:-.2px}
.tod{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.tod .l{width:118px;white-space:nowrap;font-size:13px}
.tod .l small{color:var(--sub);font-size:11px;margin-left:2px}
.tod .b{flex:1;background:var(--line);border-radius:5px;height:12px}
.tod .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
.tod .n{width:22px;text-align:right;font-weight:600}
.x{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 8px;line-height:1}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#tabs .ic{width:22px;height:22px;vertical-align:middle}
.fab .ic{width:28px;height:28px;stroke-width:2.5;vertical-align:middle}
.x .ic{width:20px;height:20px;vertical-align:middle}
.btn .ic{width:1em;height:1em;margin-right:4px}
.dlgbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);color:var(--text);border-radius:16px;padding:18px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dlg p{margin:0 0 16px;font-size:15px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bklink{display:flex;align-items:center;gap:8px;margin-top:8px;padding:12px;border:1px dashed var(--accent);border-radius:10px;color:var(--accent);font-weight:600;word-break:break-all;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{position:relative;aspect-ratio:7/10;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 4px 5px;border:0;font:inherit;min-width:0}
button.tile{cursor:pointer}
.timg{width:100%;flex:1 1 0;min-height:0;background:none;padding:0}
.ex{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none}
.tile > span{font-size:10.5px;line-height:1.15;text-align:center;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;flex:0 0 auto;height:2.3em}
.tile.done::before{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(15,23,42,.45);pointer-events:none}
.tile .tk{position:absolute;z-index:2;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:2px solid #94a3b8;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tile .tk.on{background:#16a34a;border-color:#fff;color:#fff}
.tile .tk .ic{width:12px;height:12px;stroke-width:3.5;margin:0;vertical-align:baseline}
.tw{position:relative;min-width:0}
.tw > .tile{width:100%}
.mv{position:absolute;z-index:3;top:calc(50% - 22px);width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,23,42,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.mv.l{left:3px}.mv.r{right:3px}
.mv:active{background:rgba(15,23,42,.85)}
.mv .ic{width:15px;height:15px;stroke-width:3;margin:0;vertical-align:baseline}
.tile.add{background:transparent;border:2px dashed var(--line);color:var(--sub);justify-content:center;gap:4px}
.tile.add > .ic{width:28px;height:28px;margin:0;vertical-align:baseline}
.tile.add > span{flex:none;min-height:0}
.tiles.one{grid-template-columns:104px;justify-content:center;margin-top:6px}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.icb{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:#475569;padding:3px;display:block}
.icb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:8px}
.sw{aspect-ratio:1;width:100%;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.sel{box-shadow:0 0 0 3px var(--accent)}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.note{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <header><h1>Workout Rotator</h1><div id="tabs"></div></header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="dlg" class="dlgbg" style="display:none"></div>
<div id="overlay" class="overlay" style="display:none"><div class="in" id="ovIn"></div></div>

<script>
/* app-like behaviour: block context menu, text selection and dragging unless the target is an editable field */
(() => {
  const editable = t => !!(t && t.closest && t.closest('input,textarea,[contenteditable="true"]'));
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); });
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', e => { e.preventDefault(); });
  document.addEventListener('gesturestart', e => { e.preventDefault(); });
})();

const KEY = 'workout-rotation-v1';
const VERSION = 1;

  play: '<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',

const EXI = IMG;                       // the picker offers these
const imgTag = k => `<img class="ex" src="${IMG[k]}" alt="" draggable="false">`;
/* icon ids from older versions map to the nearest new image so existing workouts keep a sensible icon */
const LEGACY_MAP = {curl:'bicep', curlmachine:'bicep', pullup:'back', pushup:'chest', overpress:'sidedelt', lateral:'sidedelt', row:'back', abmachine:'abs', crunch:'abs', plank:'abs', calf:'calves'};
const fixIcon = k => IMG[k] ? k : (LEGACY_MAP[k] || 'bicep');
const exic = k => imgTag(fixIcon(k));
const COLORS = ['#2563eb','#0d9488','#16a34a','#b45309','#dc2626','#db2777','#7c3aed','#475569'];
const MAX_EX = 12;
/* guess an icon from an exercise name (used when converting old free-text workouts) */
function guessIcon(t) {
  t = t.toLowerCase();
  const m = [
    [/kettlebell|kettle bell|swing/, 'kettlebell'], [/run|jog|sprint|treadmill/, 'running'], [/cardio|heart|hiit|conditioning/, 'heart'], [/glute|hip thrust|bridge|kickback/, 'glutes'],
    [/calf|calves/, 'calves'], [/shin|tibialis/, 'shins'], [/forearm|wrist|grip/, 'forearm'],
    [/shrug|\btrap|upright/, 'traps'], [/rear delt|reverse fly|face pull/, 'reardelt'],
    [/hamstring|leg curl|rdl|romanian|nordic/, 'hamstrings'], [/abduct/, 'abductor'], [/adduct|groin/, 'adductor'],
    [/deadlift/, 'deadlift'], [/lunge|step.?up|hip flexor/, 'lunge'], [/squat/, 'squat'], [/leg press|leg ext|quad/, 'quads'],
    [/lateral|side delt/, 'sidedelt'], [/front raise|incline/, 'frontdelt'], [/overhead|shoulder|military|ohp|arnold/, 'sidedelt'],
    [/hyperext|back ext|good morning|lower back/, 'lowerback'], [/pull.?up|chin.?up|pulldown|lat |row/, 'back'],
    [/tricep|pushdown|dip|skull/, 'tricep'], [/curl|bicep/, 'bicep'],
    [/plank|crunch|sit.?up|\bab|core|hollow/, 'abs'], [/bench|chest|push.?up|press|fly/, 'chest']
  ];
  for (const [re, k] of m) if (re.test(t)) return k;
  return 'bicep';
}
const mkTile = (label, icon, i) => ({id: uid(), label, icon, color: COLORS[i % COLORS.length]});
const textToTiles = text => String(text || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, MAX_EX)
  .map((l, i) => mkTile(l.slice(0, 28).trim(), guessIcon(l), i));
/* make older data (free-text workouts) work with tiles */
function normalize(s) {
  (s.programs || []).forEach(p => { if (!Array.isArray(p.exercises)) p.exercises = textToTiles(p.text); p.exercises.forEach(e => { e.icon = fixIcon(e.icon); }); });
  if (s.active && !Array.isArray(s.active.done)) s.active.done = [];
  return s;
}

/* ---------- in-page dialogs (browser confirm/alert can be blocked) ---------- */
let toastT = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 3500);
}
let dlgYes = null;
function ask(msg, yesLabel, onYes) {
  dlgYes = onYes;
  $('dlg').innerHTML = `<div class="dlg"><p>${esc(msg)}</p><div class="acts">
    <button class="btn sec" onclick="dlgClose(false)">Cancel</button>
    <button class="btn" onclick="dlgClose(true)">${esc(yesLabel)}</button></div></div>`;
  $('dlg').style.display = 'flex';
}
function dlgClose(ok) {
  $('dlg').style.display = 'none';
  const fn = dlgYes; dlgYes = null;
  if (ok && fn) fn();
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((Date.UTC(...ymdArr(b)) - Date.UTC(...ymdArr(a))) / 864e5);
const ymdArr = s => { const [y,m,d] = s.split('-').map(Number); return [y, m-1, d]; };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const weekStart = s => { const d = parse(s); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return ymd(d); };
const fmtDate = s => { const d = parse(s); return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}); };
const fmtShort = s => { const d = parse(s); return d.toLocaleDateString(undefined, {day:'numeric', month:'short'}); };
const fmtTime = ms => { const d = new Date(ms); let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${pad(d.getMinutes())} ${ap}`; };
const lastLabel = p => {
  if (!p.lastDone) return 'Never done';
  return `${fmtDate(p.lastDone)}${p.lastDoneAt ? ', ' + fmtTime(p.lastDoneAt) : ''} · ${ago(p.lastDone)}`;
};
const ago = s => {
  if (!s) return 'Never done';
  const n = daysBetween(s, todayStr());
  if (n <= 0) return 'Today';
  if (n === 1) return 'Yesterday';
  return n + ' days ago';
};
const clock = ms => {
  const t = Math.max(0, Math.floor(ms/1000));
  return `${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`;
};

/* ---------- storage shim (TEST BUILD) ----------
   Tries real localStorage first. If the browser blocks it (locked-down work PC),
   falls back to memory, mirrored into window.name so data survives page reloads in the same tab. */
let storageMode = 'memory';
const memStore = {};
const store = {
  get(k) {
    try { const v = window.localStorage.getItem(k); storageMode = 'local'; return v; } catch (e) {}
    try { const o = JSON.parse(window.name || '{}'); if (o && o.__wr) { storageMode = 'tab'; return o[k] ?? null; } } catch (e) {}
    return memStore[k] ?? null;
  },
  set(k, v) {
    try { window.localStorage.setItem(k, v); storageMode = 'local'; return; } catch (e) {}
    memStore[k] = v;
    try { window.name = JSON.stringify({__wr: 1, [k]: v}); storageMode = 'tab'; } catch (e) { storageMode = 'memory'; }
  }
};

,"text":"Squat 4x8\nRomanian deadlift 3x10\nLunges 3x12\nCalf raise 4x15\nPlank 3x60s","lastDone":"2026-10-31","seq":0,"exercises":[{"id":"mw4lnerdpjvws","label":"Crunch Machine","icon":"abs","color":"#7c3aed"},{"id":"mw4lnerdyi6aj","label":"Outer Thigh Machine","icon":"abductor","color":"#475569"},{"id":"mw4lnerda2chp","label":"Inner Thigh Machine","icon":"adductor","color":"#475569"},{"id":"mw526kgbifgbf","label":"Thrusts","icon":"glutes","color":"#475569"},{"id":"mw4lnerdn0dxm","label":"Shoulder Press Machine","icon":"frontdelt","color":"#b45309"},{"id":"mw4lnerdsnu53","label":"Incline Bench Press","icon":"frontdelt","color":"#b45309"},{"id":"mw4mrrk7yz412","label":"High Tri Machine","icon":"tricep","color":"#2563eb"},{"id":"mw50o1pt3s4cz","label":"Low Cable Kickbacks","icon":"tricep","color":"#2563eb"}],"lastDoneAt":null},{"id":"mw1t1bnyxh6vr","name":"Pull & Back","text":"Goblet squat 3x12\nPush-ups 3x15\nDB row 3x12\nFarmer carry 3x40m\nBike 10 min","lastDone":"2026-11-01","seq":0,"exercises":[{"id":"mw4lnerdbnfmo","label":"Lunges","icon":"lunge","color":"#475569"},{"id":"mw4lnerdtm0k6","label":"Lower Back","icon":"lowerback","color":"#475569"},{"id":"mw4lnerd55z1a","label":"Deadlifts","icon":"deadlift","color":"#475569"},{"id":"mw50uhjv4emxy","label":"Facepulls","icon":"traps","color":"#0d9488"},{"id":"mw4lnerd805rn","label":"Shrugs","icon":"traps","color":"#0d9488"},{"id":"mw4lnerdg44zd","label":"Rotator Cuffs","icon":"reardelt","color":"#0d9488"},{"id":"mw50trl3g1h9n","label":"Reverse Fly","icon":"reardelt","color":"#0d9488"},{"id":"mw50v3ejh5y9n","label":"Low rows","icon":"back","color":"#0d9488"},{"id":"mw50vdozzm5ih","label":"Supernating Dumbells","icon":"bicep","color":"#2563eb"},{"id":"mw50vracncdyr","label":"Hammer Incline","icon":"bicep","color":"#2563eb"}],"lastDoneAt":null}],"log":[{"id":"mw1t1ep82mgtb","programId":"mw1t1bnyc2x8p","name":"Push","date":"2026-11-04","at":1793777885612,"minutes":1,"note":""}],"active":null,"meta":{"lastBackup":"2026-11-06T14:20:57.314Z"}};
function seed() { return normalize(JSON.parse(JSON.stringify(DEFAULT_DATA))); }
function load() {
  try { const r = JSON.parse(store.get(KEY)); if (r && Array.isArray(r.programs)) { r.log ||= []; r.meta ||= {}; return normalize(r); } } catch (e) {}
  return seed();
}
let S = load();
const save = () => store.set(KEY, JSON.stringify(S));

let tab = 'home';

const sortedPrograms = () => S.programs.map((p,i) => ({p,i})).sort((a,b) => {
  const key = p => p.lastDoneAt || (p.lastDone ? parse(p.lastDone).getTime() : 0);
  const x = key(a.p), y = key(b.p);
  if (x !== y) return x - y;
  if ((a.p.seq||0) !== (b.p.seq||0)) return (a.p.seq||0) - (b.p.seq||0);
  return a.i - b.i;
}).map(o => o.p);

/* ---------- actions ---------- */
function startWorkout(id) {
  if (S.active) return;                       // one workout per day
  const p = S.programs.find(x => x.id === id); if (!p) return;
  const now = Date.now(), date = todayStr(), logId = uid();
  S.active = {programId: id, name: p.name, startedAt: now, date, logId, done: [],
              prev: {lastDone: p.lastDone, lastDoneAt: p.lastDoneAt || null, seq: p.seq || 0}};
  S.log.push({id: logId, programId: id, name: p.name, date, at: now, note: ''});
  p.lastDone = date; p.lastDoneAt = now; p.seq = now;
  save(); tab = 'home'; render();
}
function cancelWorkout() {
  const a = S.active; if (!a) return;
  S.log = S.log.filter(x => x.id !== a.logId);
  const p = S.programs.find(x => x.id === a.programId);
  if (p && a.prev) { p.lastDone = a.prev.lastDone; p.lastDoneAt = a.prev.lastDoneAt; p.seq = a.prev.seq; }
  S.active = null; save(); render();
}
/* The "in progress" pin only lasts for the day it was started. Next day it clears and the program sits at the bottom. */
function rollover() {
  const a = S.active;
  if (a && (a.date !== todayStr() || !S.programs.some(p => p.id === a.programId))) { S.active = null; save(); }
}

const tileHtml = (e, o = {}) => {
  const tag = o.click ? 'button' : 'div';
  return `<${tag} class="tile ${o.done ? 'done' : ''}" style="background:${e.color}" ${o.click ? `onclick="${o.click}" aria-label="${esc(e.label || e.icon)}"` : ''}>${o.tick ? `<i class="tk ${o.done ? 'on' : ''}">${o.done ? ic('check') : ''}</i>` : ''}<div class="timg">${exic(e.icon)}</div><span>${esc(e.label)}</span></${tag}>`;
};
function tick(id) {
  const a = S.active; if (!a) return;
  a.done ||= [];
  const i = a.done.indexOf(id);
  if (i < 0) a.done.push(id); else a.done.splice(i, 1);
  save(); render();
}

let draft = null;                          // the program being edited (kept until Save)
function openProgram(id) {
  const p = id ? S.programs.find(x => x.id === id) : null;
  draft = {id: id || '', name: p ? p.name : '', lastDone: p ? p.lastDone : null,
           exercises: p ? p.exercises.map(e => ({...e})) : [], mode: 'program', idx: -1};
  renderEditor(); showOv();
}
function syncDraft() {
  if (!draft || draft.mode !== 'program') return;
  const n = $('pName'), d = $('pDate');
  if (n) draft.name = n.value;
  if (d) draft.lastDone = d.value || null;
}
function renderEditor() {
  if (!draft) return;
  const y = $('overlay').scrollTop;
  $('ovIn').innerHTML = draft.mode === 'tile' ? tileEditorHtml() : programEditorHtml();
  $('overlay').scrollTop = y;
}
function programEditorHtml() {
  const n = draft.exercises.length;
  return `
    <div class="row"><h1 style="font-size:20px;margin:0">${draft.id ? 'Edit program' : 'New program'}</h1>
      <button class="x" onclick="closeOv()" aria-label="Close">${ic('close')}</button></div>
    <label>Name</label><input id="pName" value="${esc(draft.name)}" placeholder="e.g. Push">
    <label>Exercises (${n} of ${MAX_EX})</label>
    <div class="tiles" style="margin-top:6px">
      ${draft.exercises.map((e, i) => `<div class="tw">${tileHtml(e, {click: `editTile(${i})`})}${i > 0 ? `<button class="mv l" onclick="moveEx(${i},-1)" aria-label="Move earlier">${ic('left')}</button>` : ''}${i < n - 1 ? `<button class="mv r" onclick="moveEx(${i},1)" aria-label="Move later">${ic('right')}</button>` : ''}</div>`).join('')}
      ${n < MAX_EX ? `<button class="tile add" onclick="addTile()" aria-label="Add exercise">${ic('plus')}<span>Add</span></button>` : ''}
    </div>

    <div class="row"><input type="date" id="pDate" value="${draft.lastDone || ''}" style="margin-top:0">
      <button class="btn sec small" onclick="$('pDate').value=''">Clear</button></div>
    <div class="note">Blank = never done, so it sits at the top of the list.</div>
    <button class="btn big" onclick="saveProgram()">Save</button>
    ${draft.id ? `<button class="btn big danger" style="background:none" onclick="deleteProgram('${draft.id}')">Delete program</button>` : ''}`;
}
function tileEditorHtml() {
  const e = draft.exercises[draft.idx];
  return `
    <div class="row"><h1 style="font-size:20px;margin:0">Exercise ${draft.idx + 1} of ${draft.exercises.length}</h1>
      <button class="x" onclick="tileBack()" aria-label="Back">${ic('close')}</button></div>
    <div class="tiles one">${tileHtml(e)}</div>
    <label>Label (optional)</label>
    <input id="tLabel" maxlength="28" value="${esc(e.label)}" placeholder="e.g. Squat 4x8" oninput="tileLabel(this.value)">
    <label>Icon</label>
    <div class="icgrid">${Object.keys(EXI).map(k => `<button class="icb ${k === e.icon ? 'sel' : ''}" onclick="tileIcon('${k}')" aria-label="${k}">${exic(k)}</button>`).join('')}</div>
    <label>Tile colour</label>
    <div class="swatches">${COLORS.map(c => `<button class="sw ${c === e.color ? 'sel' : ''}" style="background:${c}" onclick="tileColor('${c}')" aria-label="Colour ${c}"></button>`).join('')}</div>
    <button class="btn big" onclick="tileBack()">Done</button>
    <button class="btn big danger" style="background:none" onclick="tileRemove()">Remove exercise</button>`;
}
function editTile(i) { syncDraft(); draft.mode = 'tile'; draft.idx = i; renderEditor(); $('overlay').scrollTop = 0; }
function addTile() {
  syncDraft();
  if (draft.exercises.length >= MAX_EX) { toast(`A workout can have up to ${MAX_EX} exercises.`); return; }
  const i = draft.exercises.length;
  draft.exercises.push(mkTile('', 'bicep', i));
  draft.mode = 'tile'; draft.idx = i; renderEditor(); $('overlay').scrollTop = 0;
}
function tileLabel(v) {
  draft.exercises[draft.idx].label = v;
  const s = document.querySelector('#ovIn .tiles.one .tile > span'); if (s) s.textContent = v;
}
function tileIcon(k) { draft.exercises[draft.idx].icon = k; renderEditor(); }
function tileColor(c) { draft.exercises[draft.idx].color = c; renderEditor(); }
function moveEx(i, d) {
  syncDraft();
  const a = draft.exercises, j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  renderEditor();
}
function tileBack() { draft.mode = 'program'; renderEditor(); }
function tileRemove() { draft.exercises.splice(draft.idx, 1); draft.mode = 'program'; renderEditor(); }

function saveProgram() {
  syncDraft();
  const name = draft.name.trim(); if (!name) { toast('Please enter a name.'); return; }
  if (draft.id) {
    const p = S.programs.find(x => x.id === draft.id);
    if (p.lastDone !== draft.lastDone) p.lastDoneAt = null;
    Object.assign(p, {name, lastDone: draft.lastDone, exercises: draft.exercises});
    if (S.active && S.active.programId === p.id) S.active.name = name;
  } else S.programs.push({id: uid(), name, text: '', exercises: draft.exercises, lastDone: draft.lastDone, lastDoneAt: null, seq: 0});
  save(); draft = null; closeOv(); render();
}
function deleteProgram(id) {
  const p = S.programs.find(x => x.id === id);
  ask(`Delete "${p.name}"? Past log entries are kept.`, 'Delete', () => {
    S.programs = S.programs.filter(x => x.id !== id);
    if (S.active && S.active.programId === id) S.active = null;
    save(); draft = null; closeOv(); render();
  });
}
const showOv = () => { $('overlay').style.display = 'block'; $('overlay').scrollTop = 0; };
const closeOv = () => { draft = null; $('overlay').style.display = 'none'; };

/* ---------- backup / restore ---------- */
let backupUrl = null, backupName = '';
function backup() {
  S.meta.lastBackup = new Date().toISOString(); save();
  const payload = {app: 'workout-rotation', version: VERSION, exportedAt: S.meta.lastBackup, data: S};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  if (backupUrl) URL.revokeObjectURL(backupUrl);
  backupUrl = URL.createObjectURL(blob);
  backupName = `workout-backup-${todayStr()}.json`;
  try {                                                   // try a normal download as well
    const a = document.createElement('a');
    a.href = backupUrl; a.download = backupName;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  toast('Backup link is ready below.');
  render();
}

function restore(ev) {
  const input = ev.target, f = input.files && input.files[0];
  if (!f) return;
  toast('Reading ' + f.name + '…');
  const r = new FileReader();
  r.onerror = () => toast('Could not read that file.');
  r.onload = () => {
    let d;
    try {
      const j = JSON.parse(r.result); d = j.data || j;
      if (!Array.isArray(d.programs) || !Array.isArray(d.log)) throw new Error('bad');
    } catch (e) { toast('That file is not a valid workout backup.'); return; }
    ask(`Restore ${d.programs.length} programs and ${d.log.length} log entries? This replaces everything currently in the app.`, 'Restore', () => {
      S = normalize({programs: d.programs, log: d.log, active: d.active || null, meta: d.meta || {}});
      save(); tab = 'home'; render(); toast('Restore complete.');
    });
  };
  r.readAsText(f);
  input.value = '';
}

/* ---------- views ---------- */
let thenOpen = false;
function toggleThen() { thenOpen = !thenOpen; render(); }
function viewHome() {
  const act = S.active, all = sortedPrograms();
  if (!all.length) return `<div class="empty">No programs yet.<br>Tap + to add one.</div>${fab()}`;
  const top = act ? S.programs.find(p => p.id === act.programId) : all[0];
  const rest = all.filter(p => p !== top);
  const head = `<div class="name">${esc(top.name)} <button class="x" onclick="openProgram('${top.id}')" aria-label="Edit program">${ic('pencil')}</button></div>
    ${act ? '' : `<div class="meta">${lastLabel(top)}</div>`}`;
  const action = act
    ? `<button class="twotap cancel pill" data-two="cancel" data-compact="1" data-label="Cancel" data-armed="Tap again">Cancel</button>`
    : `<button class="btn" style="white-space:nowrap" onclick="startWorkout('${top.id}')">${ic('play')} Start workout</button>`;
  const tilesHtml = top.exercises.length
    ? `<div class="tiles">${top.exercises.map(e => tileHtml(e, act ? {click: `tick('${e.id}')`, done: (act.done || []).includes(e.id), tick: true} : {})).join('')}</div>`
    : `<div class="empty" style="padding:16px 0 4px">No exercises yet. Tap the pencil to add some.</div>`;
  return `<div class="hrow ${act ? 'act' : ''}">
      <h2>${act ? `Today's workout - Started at ${fmtTime(act.startedAt)}` : 'Up next'}</h2>
      ${action}
    </div>
    <div class="card next">
      ${head}
      ${tilesHtml}
    </div>
    ${rest.length ? `<div class="thenh"><h2>Then</h2><button class="x" onclick="toggleThen()" aria-label="${thenOpen ? 'Hide other workouts' : 'Show other workouts'}" aria-expanded="${thenOpen}">${ic(thenOpen ? 'chevup' : 'down')}</button></div>` : ''}
    ${rest.map(p => thenOpen
      ? `<div class="card open" onclick="openProgram('${p.id}')">
      <div class="name">${esc(p.name)}</div><div class="meta">${lastLabel(p)}</div>
      ${p.exercises.length ? `<div class="tiles">${p.exercises.map(e => tileHtml(e, {})).join('')}</div>` : ''}
    </div>`
      : `<div class="card" onclick="openProgram('${p.id}')">
      <div class="name">${esc(p.name)}</div><div class="meta">${lastLabel(p)}</div>
    </div>`).join('')}
    ${fab()}`;
}
const fab = () => `<button class="fab" onclick="openProgram()" aria-label="Add program">${ic('plus')}</button>`;

/* two-tap confirm buttons (finish / cancel) */
const ARM_MS = 3000;
let armTimer = null, armBtn = null;
function disarm() {
  if (armTimer !== null) { clearTimeout(armTimer); armTimer = null; }
  if (armBtn) {
    armBtn.classList.remove('armed');
    armBtn.innerHTML = armBtn.dataset.compact ? armBtn.dataset.label : `<span>${armBtn.dataset.label}</span><small>tap twice</small>`;
    armBtn = null;
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-two]');
  if (!b) { disarm(); return; }
  if (armBtn === b) {
    disarm();
    cancelWorkout();
    return;
  }
  disarm();
  armBtn = b; b.classList.add('armed');
  b.innerHTML = b.dataset.compact ? b.dataset.armed : `<span>${b.dataset.armed}</span><small>resets in 3s</small>`;
  armTimer = setTimeout(disarm, ARM_MS);
});

const BUCKETS = [
  {k: 'Morning',   r: '5am–12pm', f: h => h >= 5 && h < 12},
  {k: 'Noon',      r: '12–3pm',   f: h => h >= 12 && h < 15},
  {k: 'Afternoon', r: '3–6pm',    f: h => h >= 15 && h < 18},
  {k: 'Evening',   r: '6–9pm',    f: h => h >= 18 && h < 21},
  {k: 'Night',     r: '9pm–5am',  f: h => h >= 21 || h < 5}
];

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* weekly graph labels: first bar = its month, a bar gets the month name when that month's 1st falls in its week, last bar = dd/mm */
function weekLabel(w, first) {
  const s = parse(w.s);
  if (w.i === 0) return `${s.getDate()}/${s.getMonth() + 1}`;
  for (let k = 0; k < 7; k++) { const d = new Date(s); d.setDate(s.getDate() + k); if (d.getDate() === 1) return MON[d.getMonth()]; }
  return first ? MON[s.getMonth()] : '';
}
const weekLabels = wc => wc.map((w, i) => weekLabel(w, i === 0));
/* after render: if two neighbouring labels would touch (narrow phone / wide font), hide the month label and keep the first/last bar labels */
function fitWeekLabels() {
  const spans = [...document.querySelectorAll('#main em.wl span')];
  const idx = spans.map((s, i) => s.textContent ? i : -1).filter(i => i >= 0);
  const last = spans.length - 1;
  for (let k = 1; k < idx.length; k++) {
    const a = spans[idx[k-1]], b = spans[idx[k]];
    if (a.style.visibility === 'hidden') continue;
    if (a.getBoundingClientRect().right + 1 > b.getBoundingClientRect().left) {
      const drop = (idx[k] === last || idx[k] === 0) ? (idx[k-1] === 0 ? null : a) : b;
      (drop || b).style.visibility = 'hidden';
    }
  }
}

/* cross-filtering: tap a bar in any graph to filter the other two; tap again to clear */
let flt = {week: null, dow: null, tod: null};
function setFlt(k, v) { flt[k] = flt[k] === v ? null : v; render(); }
function clearFlt() { flt = {week: null, dow: null, tod: null}; render(); }
const todIdx = at => BUCKETS.findIndex(b => b.f(new Date(at).getHours()));
const dowIdx = date => (parse(date).getDay() + 6) % 7;
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWFULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function viewStats() {
  const t = todayStr(), wk = weekStart(t), winStart = addDays(wk, -19 * 7);
  const L = S.log.filter(e => e.date >= winStart && e.date <= t);      // last 20 weeks only
  /* an entry passes if it matches every active filter except the graph's own */
  const pass = (e, own) =>
    (own === 'week' || flt.week === null || weekStart(e.date) === flt.week) &&
    (own === 'dow'  || flt.dow  === null || dowIdx(e.date) === flt.dow) &&
    (own === 'tod'  || flt.tod  === null || (e.at && todIdx(e.at) === flt.tod));

  /* 1. workouts per week */
  const wc = [];
  for (let i = 19; i >= 0; i--) wc.push({s: addDays(wk, -7*i), i, n: 0});
  L.filter(e => pass(e, 'week')).forEach(e => { const w = wc.find(x => x.s === weekStart(e.date)); if (w) w.n++; });
  const max = Math.max(1, ...wc.map(w => w.n)), wl = weekLabels(wc);
  const chart = `<div class="bars ${flt.week ? 'hs' : ''}">${wc.map((w, ix) => `<div class="${flt.week === w.s ? 'sel' : ''}" role="button" onclick="setFlt('week','${w.s}')"><b>${w.n || ''}</b><i class="${w.i===0?'cur':''}" style="height:${Math.round(w.n/max*48)}px"></i><em class="wl ${ix === 0 ? 'f' : ix === 19 ? 'l' : ''}"><span>${wl[ix]}</span></em></div>`).join('')}</div>`;

  /* 2. workouts by day of week */
  const dow = [0,0,0,0,0,0,0];
  L.filter(e => pass(e, 'dow')).forEach(e => dow[dowIdx(e.date)]++);
  const dmax = Math.max(1, ...dow);
  const dayChart = `<div class="bars ${flt.dow !== null ? 'hs' : ''}">${dow.map((n, i) => `<div class="${flt.dow === i ? 'sel' : ''}" role="button" onclick="setFlt('dow',${i})"><b>${n || ''}</b><i style="height:${Math.round(n/dmax*48)}px"></i><em>${DOW[i]}</em></div>`).join('')}</div>`;

  /* 3. time of day (entries with a recorded time only) */
  const counts = BUCKETS.map(() => 0);
  L.filter(e => e.at && pass(e, 'tod')).forEach(e => { const k = todIdx(e.at); if (k >= 0) counts[k]++; });
  const cmax = Math.max(1, ...counts);
  const tod = `<div class="todwrap ${flt.tod !== null ? 'hs' : ''}">${BUCKETS.map((b, i) => `<div class="tod ${flt.tod === i ? 'sel' : ''}" role="button" onclick="setFlt('tod',${i})"><span class="l">${b.k} <small>${b.r}</small></span><span class="b"><i style="width:${counts[i]/cmax*100}%"></i></span><span class="n">${counts[i]}</span></div>`).join('')}</div>`;

  /* footer: active-filter summary + note */
  const parts = [];
  if (flt.week) parts.push('Week of ' + fmtShort(flt.week));
  if (flt.dow !== null) parts.push(DOWFULL[flt.dow]);
  if (flt.tod !== null) parts.push(BUCKETS[flt.tod].k);
  const bar = parts.length
    ? `<span>Filtered: <b>${parts.join(' · ')}</b></span><button class="btn sec small" onclick="clearFlt()">Clear</button>`
    : `<span style="width:100%;text-align:center">Tap a bar to filter the other graphs</span>`;

  return `<h2>Workouts per week</h2>
    <div class="card">${chart}</div>
    <h2>Workouts by day</h2>
    <div class="card">${dayChart}</div>
    <h2>Time of day</h2>
    <div class="card" style="padding:10px 14px">${tod}</div>
    <div class="fltbar">${bar}</div>
    <div class="note" style="text-align:center;font-size:12px">All stats cover the last 20 weeks.</div>`;
}

function viewBackup() {
  const lb = S.meta.lastBackup ? new Date(S.meta.lastBackup).toLocaleString() : 'never';
  return `<div class="card"><div class="name">Back up</div>
      <div class="meta">Saves all programs, the log and any active workout to a JSON file. Last backup: ${lb}.</div>
      <button class="btn big" onclick="backup()">${ic('save')} Download backup</button>
      ${backupUrl ? `<div class="meta" style="margin-top:12px">Backup ready. ${storageMode === 'local' ? 'Click the link to save it, or right-click it and choose <b>Save link as</b>.' : 'Right-click the link and choose <b>Save link as</b>. Clicking it opens the backup in a new tab, where you can press Ctrl+S.'}</div>
        <a class="bklink" href="${backupUrl}" ${storageMode === 'local' ? `download="${esc(backupName)}"` : ''} target="_blank" rel="noopener">${ic('save')} ${esc(backupName)}</a>` : ''}
    </div>
    <div class="card"><div class="name">Restore</div>
      <div class="meta">Choose a backup file. This replaces everything currently in the app.</div>
      <input type="file" id="rf" accept=".json,application/json" style="display:none" onchange="restore(event)">
      <button class="btn big sec" onclick="$('rf').click()">${ic('up')} Restore from file</button></div>
    <div class="note" style="margin-top:14px">Test build: if browser storage is blocked, data is kept in memory or this tab only, so use Download backup to keep it. v${VERSION}</div>`;
}

/* ---------- render ---------- */
function banner() {
  const b = $('banner');
  b.style.display = storageMode === 'local' ? 'none' : 'block';
  b.textContent = storageMode === 'tab'
    ? 'TEST BUILD: browser storage blocked. Data kept for this tab only (survives reload, lost when the tab closes).'
    : 'TEST BUILD: browser storage blocked. Data is in memory only and resets on reload.';
}
function render() {
  rollover();
  banner();
  const views = {home: viewHome, stats: viewStats, backup: viewBackup};
  $('main').innerHTML = views[tab]();
  $('main').classList.toggle('noscroll', tab === 'home');
  if (tab === 'stats') fitWeekLabels();
  const items = [['home', ic('home'), 'Home'], ['stats', ic('chart'), 'Stats'], ['backup', ic('save'), 'Backup']];
  $('tabs').innerHTML = items.map(([k, i, l]) => `<button class="${tab===k?'on':''}" title="${l}" aria-label="${l}" onclick="tab='${k}';render()">${i}</button>`).join('');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
render();
</script>
<script>
/* PWA: offline cache + ask the browser to keep this app's data (only when served over http/https) */
if (location.protocol === 'http:' || location.protocol === 'https:') {
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
</body>
</html>
